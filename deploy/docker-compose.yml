services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # FalkorDB optional for EP-001 — unused for graph writes (graph_nodes=0).
  # Present so health can report degraded/unused without failing MVP indexing.
  falkordb:
    image: falkordb/falkordb:latest
    profiles: ["with-falkor"]
    ports:
      - "6379:6379"

  api:
    build:
      context: ../services/orchestrator
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      CONTEXTOS_QDRANT_URL: http://qdrant:6333
      CONTEXTOS_EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      # Proposed: local inference hook (Ollama) — query-time only, not indexing
      CONTEXTOS_LOCAL_INFERENCE_URL: http://host.docker.internal:11434
      CONTEXTOS_PACK_CACHE_DIR: /var/contextos/packs
      # Proposed EP-003 Serena (OQ-Symbol-REST / SDK pin open — not Confirmed freeze)
      CONTEXTOS_SERENA_ENABLED: "true"
      CONTEXTOS_SERENA_USE_TEST_DOUBLE: "true"
      CONTEXTOS_CONTEXT_SAFE_EDIT_ENRICHMENT: "true"
    volumes:
      - pack_cache:/var/contextos/packs
      # Mount host repos at runtime as needed, e.g. -v /path/to/repo:/repos/myrepo
    depends_on:
      - qdrant

  # --- EP-003 Proposed: local Serena MCP for orchestrator Pack Context enrichment ---
  # Serena is typically a host-local MCP process (ADR-005), not a required Compose service.
  # Proposed knobs on `api` (not Confirmed freeze):
  #   CONTEXTOS_SERENA_ENABLED=true
  #   CONTEXTOS_SERENA_COMMAND=<serena-mcp-launch>   # SDK pin NEEDS CLARIFICATION
  #   CONTEXTOS_SERENA_USE_TEST_DOUBLE=1             # fixtures / degraded without live MCP
  #   CONTEXTOS_CONTEXT_SAFE_EDIT_ENRICHMENT=true
  # Full Ask E2E / EP-004 CLI not required for this smoke note (T080).
  # Optional future profile example (commented — do not invent Confirmed image pin):
  # serena:
  #   profiles: ["with-serena"]
  #   image: # NEEDS CLARIFICATION — no invented Serena image pin
  #   network_mode: host

volumes:
  qdrant_data:
  pack_cache:
